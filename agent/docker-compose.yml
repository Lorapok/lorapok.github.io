services:
  lolabo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lolabo-microservice
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
      - path: ../.env
        required: false
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DAEMON=true
      - INTERVAL_HOURS=0.25
      - POSTS_JSON_PATH=/app/public/blog/posts.json
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEY_1=${GEMINI_API_KEY_1:-}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2:-}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3:-}
      - GEMINI_API_KEY_4=${GEMINI_API_KEY_4:-}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT:-}
      - FIREBASE_SERVICE_ACCOUNT_BASE64=${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
    volumes:
      - lolabo-blog-data:/app/public/blog
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  lolabo-blog-data:
