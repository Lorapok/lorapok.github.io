name: LoLaBo AI Agent

on:
  schedule:
    # Staggered twice-hourly checks avoid GitHub Actions minute :00 runner congestion.
    # The agent script gates on hoursSinceLastRun >= 0.75h so it only publishes once per hour.
    - cron: '17,47 * * * *'
  workflow_dispatch:         # Manual trigger
    inputs:
      force:
        description: 'Force run ignoring interval'
        required: false
        default: 'false'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Agent Dependencies
        run: |
          cd agent
          npm install

      - name: Run LoLaBo Agent
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          cd agent
          npx ts-node index.ts
          npx ts-node exportData.ts

      - name: Commit and Push SEO Updates
        id: git-push
        run: |
          git config --global user.name "LoLaBo Agent"
          git config --global user.email "agent@lorapok.labs"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(blog): new post by LoLaBo Agent with SEO updates"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No file changes detected. Skipping push."
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Automatic Website Deployment & SEO Rebuild
        if: steps.git-push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Triggering Deploy Lorapok Labs workflow for live SEO deployment..."
          gh workflow run deploy.yml --ref main || echo "Deploy workflow dispatched or queued."

      - name: Verify Live Deployment and Broadcast to Discord
        if: steps.git-push.outputs.pushed == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "🔍 Verifying live publication on production edge before broadcasting to Discord..."
          cd agent
          npx ts-node broadcastLivePost.ts


