name: LoLaBo AI Agent

on:
  schedule:
    # Hourly research check. Firestore cadence controls whether a candidate is generated.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation to run'
        type: choice
        required: true
        default: scheduled
        options:
          - scheduled
          - force
          - projects-only

concurrency:
  group: lolabo-production
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Prepare the persistent automation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "LoLaBo Agent"
          git config --global user.email "agent@lorapok.labs"
          if git ls-remote --exit-code --heads origin automation/lolabo >/dev/null 2>&1; then
            git fetch origin automation/lolabo
            git switch -C automation/lolabo origin/automation/lolabo
            git rebase origin/main
          else
            git switch -c automation/lolabo
          fi

      - name: Refresh public GitHub project inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-github-projects.mjs

      - name: Install Agent Dependencies and Build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'projects-only' }}
        run: |
          cd agent
          npm ci
          npm run build

      - name: Run LoLaBo Agent
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'projects-only' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          INTERVAL_HOURS: '1'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'force' }}
        run: |
          cd agent
          node index.js
          node exportData.js

      - name: Commit inventory, drafts, and gate-approved posts to a review branch
        id: git-push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/data/github-projects.json public/blog/archive/ai-posts.json public/blog/posts.json public/blog/rss.xml public/sitemap.xml
          if [ -f agent/.pending-broadcast.json ]; then git add -f agent/.pending-broadcast.json; fi
          if git diff --cached --quiet; then
            echo "Nothing new."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            if git diff --cached --quiet -- public/blog/posts.json; then MSG="chore(blog): archive LoLaBo draft (not public)"; else MSG="chore(blog): publish LoLaBo post (quality gate passed)"; fi
            git commit -m "$MSG"
            git push origin automation/lolabo
            if ! gh pr list --head automation/lolabo --base main --state open --json number --jq 'length > 0' | grep -q true; then
              gh pr create --base main --head automation/lolabo --title "chore(blog): review LoLaBo research dispatch" --body "Automated LoLaBo research update. Public posts remain quality-gated; drafts remain private until approved. Merge publishes the reviewed update and triggers the post-deployment broadcaster."
            fi
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
