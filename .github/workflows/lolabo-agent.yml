name: LoLaBo AI Agent

on:
  schedule:
    # Keep generating drafts on the 15-minute cadence. They are archived, not published.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run ignoring interval'
        required: false
        default: 'false'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Agent Dependencies and Build
        run: |
          cd agent
          npm install
          npm run build

      - name: Run LoLaBo Agent
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          INTERVAL_HOURS: '0.25'
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          cd agent
          node index.js
          node exportData.js

      - name: Commit archived drafts only
        run: |
          git config --global user.name "LoLaBo Agent"
          git config --global user.email "agent@lorapok.labs"
          git add public/blog/archive/ai-posts.json
          if git diff --cached --quiet; then
            echo "No new drafts to archive."
          else
            git commit -m "chore(blog): archive LoLaBo draft (not public)"
            git pull --rebase origin main || true
            git push origin main
          fi
