<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <!-- Lorapok Signature Bio Gradients -->
    <linearGradient id="lp-core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67ff8f" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="lp-ring-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67ff8f" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#67ff8f" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="lp-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67ff8f" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#05070c" stop-opacity="0" />
    </radialGradient>

    <filter id="lp-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="lp-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="softBlur" />
      <feMerge>
        <feMergeNode in="softBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="250" cy="250" r="230" fill="url(#lp-ambient-glow)" />

  <!-- Outer Bio-Shield Ring -->
  <circle cx="250" cy="250" r="215" stroke="url(#lp-ring-grad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="250" cy="250" r="195" stroke="#ffffff" stroke-width="1" opacity="0.1" />

  <!-- Metamorphic Orbital Guides -->
  <path d="M 250 55 A 195 195 0 0 1 445 250" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 180" opacity="0.8" />
  <path d="M 250 445 A 195 195 0 0 1 55 250" stroke="#67ff8f" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 180" opacity="0.8" />

  <!-- Hexagonal Tech Lattice Nodes -->
  <polygon points="250,75 390,155 390,345 250,425 110,345 110,155" stroke="#67ff8f" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 8" fill="none" />
  
  <!-- Cardinal Alignment Nodes -->
  <circle cx="250" cy="75" r="4" fill="#67ff8f" filter="url(#lp-soft-glow)" />
  <circle cx="390" cy="155" r="4" fill="#38bdf8" filter="url(#lp-soft-glow)" />
  <circle cx="390" cy="345" r="4" fill="#67ff8f" filter="url(#lp-soft-glow)" />
  <circle cx="250" cy="425" r="4" fill="#38bdf8" filter="url(#lp-soft-glow)" />
  <circle cx="110" cy="345" r="4" fill="#67ff8f" filter="url(#lp-soft-glow)" />
  <circle cx="110" cy="155" r="4" fill="#38bdf8" filter="url(#lp-soft-glow)" />

  <!-- Inner Dynamic Biomorphic Arcs -->
  <path d="M 170 190 Q 250 110 330 190" stroke="url(#lp-core-grad)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 170 310 Q 250 390 330 310" stroke="url(#lp-core-grad)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Core Metamorphosis Segments (Larva -> Synapse -> Core) -->
  <!-- Synaptic Connectors -->
  <line x1="250" y1="165" x2="250" y2="225" stroke="#67ff8f" stroke-width="5" stroke-linecap="round" opacity="0.6" />
  <line x1="250" y1="275" x2="250" y2="335" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.6" />
  <line x1="205" y1="250" x2="295" y2="250" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="2 4" />

  <!-- Segment 1: Head / Sensory Nucleus -->
  <circle cx="250" cy="165" r="28" fill="url(#lp-core-grad)" filter="url(#lp-bloom)" />
  <circle cx="250" cy="165" r="14" fill="#ffffff" opacity="0.9" />

  <!-- Segment 2: Central Cyber-Heart (Main Reactor) -->
  <circle cx="250" cy="250" r="42" fill="#090d14" stroke="url(#lp-core-grad)" stroke-width="4" filter="url(#lp-bloom)" />
  <circle cx="250" cy="250" r="30" fill="url(#lp-core-grad)" opacity="0.85" />
  <circle cx="250" cy="250" r="16" fill="#ffffff" />
  <circle cx="250" cy="250" r="8" fill="#090d14" />

  <!-- Segment 3: Propulsion / Base Nucleus -->
  <circle cx="250" cy="335" r="24" fill="url(#lp-core-grad)" filter="url(#lp-bloom)" />
  <circle cx="250" cy="335" r="11" fill="#ffffff" opacity="0.9" />

  <!-- Synaptic Satellite Pulses -->
  <circle cx="190" cy="250" r="5" fill="#67ff8f" filter="url(#lp-soft-glow)" />
  <circle cx="310" cy="250" r="5" fill="#38bdf8" filter="url(#lp-soft-glow)" />
</svg>
