<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <!-- Lorapok Signature Bio Gradients -->
    <linearGradient id="lp-core-grad-anim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67ff8f" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="lp-ring-grad-anim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67ff8f" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#67ff8f" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="lp-ambient-glow-anim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67ff8f" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#05070c" stop-opacity="0" />
    </radialGradient>

    <filter id="lp-bloom-anim" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="lp-soft-glow-anim" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="softBlur" />
      <feMerge>
        <feMergeNode in="softBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes lp-rot-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes lp-rot-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes lp-pulse-core {
        0%, 100% { transform: scale(1); opacity: 0.92; filter: drop-shadow(0 0 10px rgba(103, 255, 143, 0.4)); }
        50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 24px rgba(56, 189, 248, 0.8)); }
      }
      @keyframes lp-pulse-seg1 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-4px) scale(1.06); }
      }
      @keyframes lp-pulse-seg3 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(4px) scale(1.06); }
      }
      @keyframes lp-wave-expand {
        0% { r: 50px; opacity: 0.8; }
        100% { r: 215px; opacity: 0; }
      }

      .lp-anim-cw {
        transform-origin: 250px 250px;
        animation: lp-rot-cw 20s linear infinite;
      }
      .lp-anim-ccw {
        transform-origin: 250px 250px;
        animation: lp-rot-ccw 28s linear infinite;
      }
      .lp-anim-core {
        transform-origin: 250px 250px;
        animation: lp-pulse-core 3s ease-in-out infinite;
      }
      .lp-anim-seg1 {
        transform-origin: 250px 165px;
        animation: lp-pulse-seg1 3s ease-in-out infinite;
      }
      .lp-anim-seg3 {
        transform-origin: 250px 335px;
        animation: lp-pulse-seg3 3s ease-in-out infinite;
      }
      .lp-sonar-ring {
        transform-origin: 250px 250px;
        animation: lp-wave-expand 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="250" cy="250" r="230" fill="url(#lp-ambient-glow-anim)" />

  <!-- Heartbeat Sonar Wave -->
  <circle class="lp-sonar-ring" cx="250" cy="250" r="50" stroke="#67ff8f" stroke-width="1.5" fill="none" />

  <!-- Outer Bio-Shield Ring (Rotating Clockwise) -->
  <g class="lp-anim-cw">
    <circle cx="250" cy="250" r="215" stroke="url(#lp-ring-grad-anim)" stroke-width="2.5" stroke-dasharray="14 10 3 10" opacity="0.75" />
    <path d="M 250 35 A 215 215 0 0 1 465 250" stroke="#67ff8f" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="25 190" filter="url(#lp-bloom-anim)" />
    <path d="M 250 465 A 215 215 0 0 1 35 250" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="25 190" filter="url(#lp-bloom-anim)" />
  </g>

  <!-- Inner Hex Lattice (Rotating Counter-Clockwise) -->
  <g class="lp-anim-ccw">
    <polygon points="250,75 390,155 390,345 250,425 110,345 110,155" stroke="#67ff8f" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 8" fill="none" />
    <!-- Cardinal Alignment Synaptic Nodes -->
    <circle cx="250" cy="75" r="5" fill="#67ff8f" filter="url(#lp-soft-glow-anim)" />
    <circle cx="390" cy="155" r="5" fill="#38bdf8" filter="url(#lp-soft-glow-anim)" />
    <circle cx="390" cy="345" r="5" fill="#67ff8f" filter="url(#lp-soft-glow-anim)" />
    <circle cx="250" cy="425" r="5" fill="#38bdf8" filter="url(#lp-soft-glow-anim)" />
    <circle cx="110" cy="345" r="5" fill="#67ff8f" filter="url(#lp-soft-glow-anim)" />
    <circle cx="110" cy="155" r="5" fill="#38bdf8" filter="url(#lp-soft-glow-anim)" />
  </g>

  <!-- Biomorphic Wave Guides -->
  <path d="M 170 190 Q 250 110 330 190" stroke="url(#lp-core-grad-anim)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75" />
  <path d="M 170 310 Q 250 390 330 310" stroke="url(#lp-core-grad-anim)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Synaptic Connectors -->
  <line x1="250" y1="165" x2="250" y2="225" stroke="#67ff8f" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  <line x1="250" y1="275" x2="250" y2="335" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  <line x1="205" y1="250" x2="295" y2="250" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="2 4" />

  <!-- Segment 1: Head / Sensory Nucleus (Animated) -->
  <g class="lp-anim-seg1">
    <circle cx="250" cy="165" r="28" fill="url(#lp-core-grad-anim)" filter="url(#lp-bloom-anim)" />
    <circle cx="250" cy="165" r="14" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Segment 2: Central Cyber-Heart (Main Reactor, Pulsing) -->
  <g class="lp-anim-core">
    <circle cx="250" cy="250" r="44" fill="#090d14" stroke="url(#lp-core-grad-anim)" stroke-width="4" filter="url(#lp-bloom-anim)" />
    <circle cx="250" cy="250" r="32" fill="url(#lp-core-grad-anim)" opacity="0.85" />
    <circle cx="250" cy="250" r="18" fill="#ffffff" />
    <circle cx="250" cy="250" r="9" fill="#090d14" />
  </g>

  <!-- Segment 3: Propulsion / Base Nucleus (Animated) -->
  <g class="lp-anim-seg3">
    <circle cx="250" cy="335" r="24" fill="url(#lp-core-grad-anim)" filter="url(#lp-bloom-anim)" />
    <circle cx="250" cy="335" r="12" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Synaptic Satellite Pulses -->
  <circle cx="190" cy="250" r="6" fill="#67ff8f" filter="url(#lp-soft-glow-anim)" />
  <circle cx="310" cy="250" r="6" fill="#38bdf8" filter="url(#lp-soft-glow-anim)" />
</svg>
