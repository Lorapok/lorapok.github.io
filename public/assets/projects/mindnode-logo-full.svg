<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4338ca"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="body" x1="196" y1="120" x2="316" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle node network -->
  <g opacity="0.35" stroke="#67e8f9" stroke-width="2">
    <circle cx="96" cy="120" r="4" fill="#22d3ee"/>
    <circle cx="416" cy="96" r="4" fill="#c084fc"/>
    <circle cx="420" cy="380" r="4" fill="#22d3ee"/>
    <circle cx="88" cy="392" r="4" fill="#c084fc"/>
    <path d="M96 120 L180 160 M416 96 L330 150 M420 380 L340 330 M88 392 L170 340" stroke-dasharray="6 8"/>
  </g>

  <!-- Lorapok-style caterpillar mascot -->
  <g transform="translate(256 268)" filter="url(#glow)">
    <!-- antennae -->
    <path d="M-18 -118 C-28 -150 -8 -158 0 -132" stroke="url(#neon)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M18 -118 C28 -150 8 -158 0 -132" stroke="url(#neon)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="-28" cy="-154" r="7" fill="#22d3ee"/>
    <circle cx="28" cy="-154" r="7" fill="#c084fc"/>

    <!-- head -->
    <ellipse cx="0" cy="-92" rx="58" ry="52" fill="url(#body)" stroke="#22d3ee" stroke-width="4"/>
    <circle cx="-20" cy="-98" r="16" fill="#22d3ee" opacity="0.95"/>
    <circle cx="20" cy="-98" r="16" fill="#c084fc" opacity="0.95"/>
    <circle cx="-16" cy="-102" r="5" fill="#0f172a"/>
    <circle cx="24" cy="-102" r="5" fill="#0f172a"/>
    <path d="M-14 -74 Q0 -62 14 -74" stroke="#34d399" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="-32" cy="-78" r="4" fill="#34d399" opacity="0.8"/>
    <circle cx="32" cy="-78" r="4" fill="#34d399" opacity="0.8"/>

    <!-- body segments -->
    <ellipse cx="0" cy="-18" rx="54" ry="44" fill="url(#body)" stroke="#22d3ee" stroke-width="3.5"/>
    <ellipse cx="0" cy="38" rx="50" ry="40" fill="url(#body)" stroke="#a855f7" stroke-width="3.5"/>
    <ellipse cx="0" cy="88" rx="44" ry="34" fill="url(#body)" stroke="#22d3ee" stroke-width="3.5"/>

    <!-- circuit dots on segments -->
    <circle cx="-18" cy="-20" r="3" fill="#22d3ee"/>
    <circle cx="16" cy="-8" r="3" fill="#c084fc"/>
    <circle cx="0" cy="40" r="3" fill="#22d3ee"/>
    <circle cx="20" cy="52" r="3" fill="#34d399"/>

    <!-- arms -->
    <path d="M-54 -10 L-78 8" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
    <path d="M54 -10 L78 8" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>

    <!-- MindNode: encrypted note + lock -->
    <g transform="translate(0 -8)">
      <rect x="-26" y="-6" width="52" height="40" rx="8" fill="#312e81" stroke="#67e8f9" stroke-width="2.5"/>
      <path d="M-18 6 L-6 -8 L6 6 L18 -6" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="0" cy="22" r="10" fill="#1e1b4b" stroke="#22d3ee" stroke-width="2.5"/>
      <path d="M-6 22 V18 C-6 14 -2 11 0 11 C2 11 6 14 6 18 V22" stroke="#22d3ee" stroke-width="2.5" fill="none"/>
    </g>
  </g>

  <!-- corner accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" stroke="url(#neon)" stroke-width="2" opacity="0.35" fill="none"/>
</svg>
