<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="SmartOffice.ai">
  <title>SmartOffice.ai — Enterprise ERP &amp; Automation</title>
  <defs>
    <linearGradient id="so-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="so-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#060913"/>
  <rect width="1200" height="630" fill="url(#so-glow)"/>

  <!-- Grid decoration -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Icon emblem -->
  <g transform="translate(88, 120)">
    <rect width="120" height="120" rx="28" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="25" y="25" width="70" height="70" rx="16" fill="url(#so-grad)"/>
    <path d="M45 60 L55 70 L75 50" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="88" y="340" font-family="system-ui, -apple-system, sans-serif"
        font-size="68" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">SmartOffice.ai</text>
  <text x="88" y="410" font-family="system-ui, -apple-system, sans-serif"
        font-size="34" font-weight="500" fill="#38bdf8">Modular ERP &amp; Business Process Automation</text>
  <text x="88" y="470" font-family="system-ui, -apple-system, sans-serif"
        font-size="24" font-weight="400" fill="#94a3b8">HRMS, SCM &amp; Scalable Workflow Engine • React &amp; Laravel</text>
</svg>
