<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <!-- Tri-Color Gradients -->
    <linearGradient id="llb-lo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67ff8f" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="llb-la-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="llb-bo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Unified Tri-Vortex Prism Gradient -->
    <radialGradient id="llb-core-vortex" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="llb-bg-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.12" />
      <stop offset="75%" stop-color="#67ff8f" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <filter id="llb-glow-high" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="llb-glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="softBlur" />
      <feMerge>
        <feMergeNode in="softBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Dark Background -->
  <circle cx="250" cy="250" r="235" fill="url(#llb-bg-ambient)" />

  <!-- Outer Broadcast Radar Waves (Autonomous Transmission) -->
  <circle cx="250" cy="250" r="220" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4" />
  <circle cx="250" cy="250" r="195" stroke="#c084fc" stroke-width="2" stroke-dasharray="16 12" opacity="0.4" />
  <circle cx="250" cy="250" r="165" stroke="#67ff8f" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35" />

  <!-- Hexagonal Prism Frame -->
  <polygon points="250,60 415,155 415,345 250,440 85,345 85,155" stroke="url(#llb-la-grad)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 8" fill="none" />
  
  <!-- Optical Interconnection Channels (Triquetra Vectors) -->
  <path d="M 185 180 Q 250 250 315 180" stroke="#67ff8f" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 315 180 Q 250 250 250 330" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 250 330 Q 250 250 185 180" stroke="#c084fc" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Radiating Synthetic Sparks to Nodes -->
  <line x1="250" y1="250" x2="185" y2="180" stroke="#67ff8f" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <line x1="250" y1="250" x2="315" y2="180" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <line x1="250" y1="250" x2="250" y2="330" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

  <!-- Node 1: "Lo" (Top-Left / Emerald / Lorapok Lineage) -->
  <g filter="url(#llb-glow-high)">
    <circle cx="185" cy="180" r="36" fill="#07090e" stroke="url(#llb-lo-grad)" stroke-width="3.5" />
    <circle cx="185" cy="180" r="24" fill="url(#llb-lo-grad)" opacity="0.9" />
    <circle cx="185" cy="180" r="12" fill="#ffffff" />
    <circle cx="185" cy="180" r="6" fill="#07090e" />
  </g>
  <text x="185" y="132" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="16" fill="#67ff8f" text-anchor="middle" letter-spacing="1">
    LO
  </text>

  <!-- Node 2: "La" (Top-Right / Cyan / Labs & Neural Ingestion) -->
  <g filter="url(#llb-glow-high)">
    <circle cx="315" cy="180" r="36" fill="#07090e" stroke="url(#llb-la-grad)" stroke-width="3.5" />
    <circle cx="315" cy="180" r="24" fill="url(#llb-la-grad)" opacity="0.9" />
    <circle cx="315" cy="180" r="12" fill="#ffffff" />
    <circle cx="315" cy="180" r="6" fill="#07090e" />
  </g>
  <text x="315" y="132" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="16" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
    LA
  </text>

  <!-- Node 3: "Bo" (Bottom / Neon Orchid / Bot & Literary Dispatch) -->
  <g filter="url(#llb-glow-high)">
    <circle cx="250" cy="330" r="36" fill="#07090e" stroke="url(#llb-bo-grad)" stroke-width="3.5" />
    <circle cx="250" cy="330" r="24" fill="url(#llb-bo-grad)" opacity="0.9" />
    <circle cx="250" cy="330" r="12" fill="#ffffff" />
    <circle cx="250" cy="330" r="6" fill="#07090e" />
  </g>
  <text x="250" y="388" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="16" fill="#c084fc" text-anchor="middle" letter-spacing="1">
    BO
  </text>

  <!-- Central Dispatch Spark (The Convergence Nexus) -->
  <circle cx="250" cy="250" r="28" fill="url(#llb-core-vortex)" filter="url(#llb-glow-high)" />
  <circle cx="250" cy="250" r="12" fill="#ffffff" />
  <circle cx="250" cy="250" r="5" fill="#07090e" />

  <!-- Peripheral Data Points -->
  <circle cx="250" cy="60" r="4.5" fill="#38bdf8" filter="url(#llb-glow-soft)" />
  <circle cx="415" cy="155" r="4.5" fill="#c084fc" filter="url(#llb-glow-soft)" />
  <circle cx="415" cy="345" r="4.5" fill="#67ff8f" filter="url(#llb-glow-soft)" />
  <circle cx="250" cy="440" r="4.5" fill="#38bdf8" filter="url(#llb-glow-soft)" />
  <circle cx="85" cy="345" r="4.5" fill="#c084fc" filter="url(#llb-glow-soft)" />
  <circle cx="85" cy="155" r="4.5" fill="#67ff8f" filter="url(#llb-glow-soft)" />
</svg>
