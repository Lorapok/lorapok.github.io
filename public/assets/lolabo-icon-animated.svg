<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <!-- Tri-Color Gradients -->
    <linearGradient id="llb-lo-grad-anim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67ff8f" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="llb-la-grad-anim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="llb-bo-grad-anim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Unified Tri-Vortex Prism Gradient -->
    <radialGradient id="llb-core-vortex-anim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="llb-bg-ambient-anim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.14" />
      <stop offset="75%" stop-color="#67ff8f" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <filter id="llb-glow-anim" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="llb-glow-soft-anim" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="softBlur" />
      <feMerge>
        <feMergeNode in="softBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes llb-radar-sweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes llb-radar-pulse {
        0% { r: 30px; opacity: 0.85; }
        100% { r: 230px; opacity: 0; }
      }
      @keyframes llb-spark-flicker {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6)); }
        50% { transform: scale(1.18); filter: drop-shadow(0 0 25px rgba(192, 132, 252, 0.9)); }
      }
      @keyframes llb-node-lo {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-5px) scale(1.08); }
      }
      @keyframes llb-node-la {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-5px) scale(1.08); }
      }
      @keyframes llb-node-bo {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(5px) scale(1.08); }
      }

      .llb-radar {
        transform-origin: 250px 250px;
        animation: llb-radar-sweep 16s linear infinite;
      }
      .llb-pulse-ring1 {
        transform-origin: 250px 250px;
        animation: llb-radar-pulse 3s cubic-bezier(0.1, 0.7, 0.1, 1) infinite;
      }
      .llb-pulse-ring2 {
        transform-origin: 250px 250px;
        animation: llb-radar-pulse 3s cubic-bezier(0.1, 0.7, 0.1, 1) infinite 1.5s;
      }
      .llb-spark {
        transform-origin: 250px 250px;
        animation: llb-spark-flicker 2.4s ease-in-out infinite;
      }
      .llb-node-1 {
        transform-origin: 185px 180px;
        animation: llb-node-lo 3s ease-in-out infinite;
      }
      .llb-node-2 {
        transform-origin: 315px 180px;
        animation: llb-node-la 3s ease-in-out infinite 1s;
      }
      .llb-node-3 {
        transform-origin: 250px 330px;
        animation: llb-node-bo 3s ease-in-out infinite 2s;
      }
    </style>
  </defs>

  <!-- Ambient Dark Background -->
  <circle cx="250" cy="250" r="235" fill="url(#llb-bg-ambient-anim)" />

  <!-- Autonomous Broadcast Radar Pulses -->
  <circle class="llb-pulse-ring1" cx="250" cy="250" r="30" stroke="#38bdf8" stroke-width="2" fill="none" />
  <circle class="llb-pulse-ring2" cx="250" cy="250" r="30" stroke="#c084fc" stroke-width="2" fill="none" />

  <!-- Rotating Hexagonal Transmission Lattice -->
  <g class="llb-radar">
    <circle cx="250" cy="250" r="218" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4" />
    <circle cx="250" cy="250" r="195" stroke="#c084fc" stroke-width="2" stroke-dasharray="16 12" opacity="0.45" />
    <polygon points="250,60 415,155 415,345 250,440 85,345 85,155" stroke="url(#llb-la-grad-anim)" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="10 8" fill="none" />
    <circle cx="250" cy="60" r="5" fill="#38bdf8" filter="url(#llb-glow-soft-anim)" />
    <circle cx="415" cy="155" r="5" fill="#c084fc" filter="url(#llb-glow-soft-anim)" />
    <circle cx="415" cy="345" r="5" fill="#67ff8f" filter="url(#llb-glow-soft-anim)" />
    <circle cx="250" cy="440" r="5" fill="#38bdf8" filter="url(#llb-glow-soft-anim)" />
    <circle cx="85" cy="345" r="5" fill="#c084fc" filter="url(#llb-glow-soft-anim)" />
    <circle cx="85" cy="155" r="5" fill="#67ff8f" filter="url(#llb-glow-soft-anim)" />
  </g>
  
  <!-- Optical Interconnection Channels -->
  <path d="M 185 180 Q 250 250 315 180" stroke="#67ff8f" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />
  <path d="M 315 180 Q 250 250 250 330" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />
  <path d="M 250 330 Q 250 250 185 180" stroke="#c084fc" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Radiating Synthetic Transmission Vectors -->
  <line x1="250" y1="250" x2="185" y2="180" stroke="#67ff8f" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
  <line x1="250" y1="250" x2="315" y2="180" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
  <line x1="250" y1="250" x2="250" y2="330" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

  <!-- Node 1: "Lo" (Animated) -->
  <g class="llb-node-1" filter="url(#llb-glow-anim)">
    <circle cx="185" cy="180" r="36" fill="#07090e" stroke="url(#llb-lo-grad-anim)" stroke-width="3.5" />
    <circle cx="185" cy="180" r="24" fill="url(#llb-lo-grad-anim)" opacity="0.9" />
    <circle cx="185" cy="180" r="12" fill="#ffffff" />
    <circle cx="185" cy="180" r="6" fill="#07090e" />
  </g>
  <text x="185" y="132" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="16" fill="#67ff8f" text-anchor="middle" letter-spacing="1">
    LO
  </text>

  <!-- Node 2: "La" (Animated) -->
  <g class="llb-node-2" filter="url(#llb-glow-anim)">
    <circle cx="315" cy="180" r="36" fill="#07090e" stroke="url(#llb-la-grad-anim)" stroke-width="3.5" />
    <circle cx="315" cy="180" r="24" fill="url(#llb-la-grad-anim)" opacity="0.9" />
    <circle cx="315" cy="180" r="12" fill="#ffffff" />
    <circle cx="315" cy="180" r="6" fill="#07090e" />
  </g>
  <text x="315" y="132" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="16" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
    LA
  </text>

  <!-- Node 3: "Bo" (Animated) -->
  <g class="llb-node-3" filter="url(#llb-glow-anim)">
    <circle cx="250" cy="330" r="36" fill="#07090e" stroke="url(#llb-bo-grad-anim)" stroke-width="3.5" />
    <circle cx="250" cy="330" r="24" fill="url(#llb-bo-grad-anim)" opacity="0.9" />
    <circle cx="250" cy="330" r="12" fill="#ffffff" />
    <circle cx="250" cy="330" r="6" fill="#07090e" />
  </g>
  <text x="250" y="388" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="16" fill="#c084fc" text-anchor="middle" letter-spacing="1">
    BO
  </text>

  <!-- Central Dispatch Spark (Animated Breathing Nexus) -->
  <g class="llb-spark">
    <circle cx="250" cy="250" r="28" fill="url(#llb-core-vortex-anim)" filter="url(#llb-glow-anim)" />
    <circle cx="250" cy="250" r="12" fill="#ffffff" />
    <circle cx="250" cy="250" r="5" fill="#07090e" />
  </g>
</svg>
