<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" fill="none">
  <defs>
    <linearGradient id="lpl-grad-anim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67ff8f" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="lpl-text-grad-anim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#67ff8f" />
    </linearGradient>

    <filter id="lpl-glow-anim" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes lpl-rot-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes lpl-pulse-core {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(103, 255, 143, 0.4)); }
        50% { transform: scale(1.1); filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.8)); }
      }
      @keyframes lpl-pulse-badge {
        0%, 100% { stroke-opacity: 0.5; box-shadow: 0 0 10px rgba(103, 255, 143, 0.2); }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px rgba(103, 255, 143, 0.6)); }
      }
      @keyframes lpl-cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      .lpl-spin {
        transform-origin: 115px 115px;
        animation: lpl-rot-cw 20s linear infinite;
      }
      .lpl-core {
        transform-origin: 115px 115px;
        animation: lpl-pulse-core 3s ease-in-out infinite;
      }
      .lpl-badge {
        animation: lpl-pulse-badge 2.5s ease-in-out infinite;
      }
      .lpl-cursor {
        animation: lpl-cursor-blink 1.5s step-start infinite;
      }
    </style>
  </defs>

  <!-- Left Icon Mark (x: 120, y: 120) -->
  <g transform="translate(15, 5)">
    <!-- Rotating Outer Shield -->
    <g class="lpl-spin">
      <circle cx="115" cy="115" r="95" stroke="url(#lpl-grad-anim)" stroke-width="2" stroke-dasharray="8 6" opacity="0.7" />
      <circle cx="115" cy="115" r="85" stroke="#ffffff" stroke-width="1" opacity="0.12" />
      <polygon points="115,35 180,75 180,155 115,195 50,155 50,75" stroke="#67ff8f" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="3 5" fill="none" />
      <circle cx="115" cy="35" r="3" fill="#67ff8f" />
      <circle cx="180" cy="155" r="3" fill="#38bdf8" />
      <circle cx="50" cy="155" r="3" fill="#67ff8f" />
    </g>

    <!-- Static Bio Structure -->
    <line x1="115" y1="75" x2="115" y2="105" stroke="#67ff8f" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />
    <line x1="115" y1="125" x2="115" y2="155" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />

    <!-- Segments with Animated Pulsing Core -->
    <circle cx="115" cy="75" r="14" fill="url(#lpl-grad-anim)" filter="url(#lpl-glow-anim)" />
    <circle cx="115" cy="75" r="7" fill="#ffffff" />

    <g class="lpl-core">
      <circle cx="115" cy="115" r="23" fill="#090d14" stroke="url(#lpl-grad-anim)" stroke-width="2.5" filter="url(#lpl-glow-anim)" />
      <circle cx="115" cy="115" r="15" fill="url(#lpl-grad-anim)" opacity="0.9" />
      <circle cx="115" cy="115" r="7.5" fill="#ffffff" />
    </g>

    <circle cx="115" cy="155" r="12" fill="url(#lpl-grad-anim)" filter="url(#lpl-glow-anim)" />
    <circle cx="115" cy="155" r="6" fill="#ffffff" />

    <!-- Satellites -->
    <circle cx="85" cy="115" r="3.5" fill="#67ff8f" filter="url(#lpl-glow-anim)" />
    <circle cx="145" cy="115" r="3.5" fill="#38bdf8" filter="url(#lpl-glow-anim)" />
  </g>

  <!-- Divider Line -->
  <line x1="260" y1="50" x2="260" y2="190" stroke="url(#lpl-grad-anim)" stroke-width="2" opacity="0.35" stroke-linecap="round" />

  <!-- Typography (Right) -->
  <!-- "LORAPOK" -->
  <text x="295" y="125" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="78" fill="url(#lpl-text-grad-anim)" letter-spacing="-2">
    LORAPOK
  </text>
  
  <!-- "LABS" Accent Badge (Pulsing Glow) -->
  <g class="lpl-badge">
    <rect x="700" y="72" width="135" height="52" rx="10" fill="#67ff8f" fill-opacity="0.14" stroke="#67ff8f" stroke-width="1.8" />
    <text x="767" y="107" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="28" fill="#67ff8f" text-anchor="middle" letter-spacing="3">
      LABS
    </text>
  </g>

  <!-- Tagline / Subtitle -->
  <text x="298" y="165" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" fill="#38bdf8" letter-spacing="4" opacity="0.95">
    BIOLOGICAL SOFTWARE // AUTONOMOUS MULTI-AGENT SYSTEMS
  </text>

  <!-- Subtle Micro Ticks & Blinking Status Light -->
  <circle class="lpl-cursor" cx="298" cy="188" r="3" fill="#67ff8f" />
  <text x="310" y="192" font-family="'JetBrains Mono', monospace" font-size="11" fill="#888888" letter-spacing="2">
    ECOSYSTEM ROOT // CORE SPEC v2.4 ONLINE
  </text>
</svg>
